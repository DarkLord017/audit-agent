[project]
name = "evmbench-backend"
version = "0.1.0"
description = "Agent harness for finding smart contract bugs"
requires-python = ">=3.11"
dependencies = [
    # web API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",   # needed for file uploads
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "docker>=7.1",
    # llm proxy
    "httpx>=0.28",
    "cryptography>=44.0",
    # job queue
    "pika>=1.3",
]

[project.optional-dependencies]
# Only the worker image needs these. Keeps the API image small.
worker = ["claude-agent-sdk>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",   
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
