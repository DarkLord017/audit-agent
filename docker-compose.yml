
name: evmbench

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evmbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evmbench}
      POSTGRES_DB: evmbench
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/table.sql:/docker-entrypoint-initdb.d/01-table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evmbench -d evmbench"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backplane]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-evmbench}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-evmbench}
    ports:
      # Localhost only so `make` help (http://localhost:15672) still works.
      # Production should leave this unpublished.
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backplane]

  api:
    image: evmbench/backend:latest
    build:
      context: .
      dockerfile: backend/docker/backend/Dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 1337
    environment:
      DATABASE_URL: postgresql://evmbench:${POSTGRES_PASSWORD:-evmbench}@postgres:5432/evmbench
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-evmbench}:${RABBITMQ_PASSWORD:-evmbench}@rabbitmq:5672/%2F
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      PROXY_SECRET_KEY: ${PROXY_SECRET_KEY:?run 'make secret' and put it in .env}
      UPLOAD_DIR: ${PWD}/uploads
    volumes:
      - ${PWD}/uploads:${PWD}/uploads
    ports:
      - "1337:1337"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backplane]

  proxy:
    # The worker reaches this by name. docker_backend.py hardcodes
    # http://evmbench-proxy:8084, so the container name is load-bearing.
    container_name: evmbench-proxy
    image: evmbench/backend:latest
    command: uvicorn backend.proxy.main:app --host 0.0.0.0 --port 8084
    environment:
      DATABASE_URL: postgresql://evmbench:${POSTGRES_PASSWORD:-evmbench}@postgres:5432/evmbench
      PROXY_SECRET_KEY: ${PROXY_SECRET_KEY:?run 'make secret' and put it in .env}
      # Only needed for an identity-linked key, which the API refuses
      # unless the request names a workspace. Blank is fine otherwise.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
    # The only service on all three: it talks to Postgres, it is the sole
    # thing the isolated workers can reach, and it is the sole route out.
    networks: [backplane, isolated, egress]

  instancer:
    image: evmbench/backend:latest
    command: python -m backend.instancer.consumer
    # Root because it drives the Docker socket. It starts the sandboxes;
    # it is not itself the sandbox.
    user: root
    environment:
      DATABASE_URL: postgresql://evmbench:${POSTGRES_PASSWORD:-evmbench}@postgres:5432/evmbench
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-evmbench}:${RABBITMQ_PASSWORD:-evmbench}@rabbitmq:5672/%2F
      WORKER_IMAGE_SOLIDITY: ${WORKER_IMAGE_SOLIDITY:-evmbench/worker-solidity:latest}
      INSTANCER_CONCURRENCY: ${INSTANCER_CONCURRENCY:-3}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-10800}
      WORKER_MEMORY: ${WORKER_MEMORY:-4g}
      WORKER_CPUS: ${WORKER_CPUS:-3}
      # Same host-path rule as UPLOAD_DIR. The instancer creates this
      # directory and chowns it to the worker uid, then hands the path to
      # the Docker daemon as a bind source -- which the daemon resolves on
      # the host. If the two differ the daemon silently creates a
      # root-owned directory instead and the worker cannot write its
      # report into it.
      OUTPUT_DIR: ${PWD}/outputs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/uploads:${PWD}/uploads
      - ${PWD}/outputs:${PWD}/outputs
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backplane]

volumes:
  pgdata:

networks:
  backplane:
    name: evmbench_backplane
  isolated:
    name: evmbench_isolated
    internal: true          
  egress:
    name: evmbench_egress
